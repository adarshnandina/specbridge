{% extends "base.html" %}
{% block title %}Log in · SpecBridge{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="/ui/login" class="card narrow">
  <label>API key
    <input type="password" name="api_key" autocomplete="off" required autofocus>
  </label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
