[project]
name = "specbridge"
version = "0.1.0"
description = "Datasheet Q&A, structured extraction and part-substitution agent with an evaluation framework"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Adarsh Kumar Reddy Nandina", email = "adarshreddyn99@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pymupdf>=1.24",
  "sentence-transformers>=3.0",
  "anthropic[bedrock]>=0.40",
  "pint>=0.24",
  "rapidfuzz>=3.9",
  "tenacity>=9.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "limits>=3.13",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "pyyaml>=6.0",
  "reportlab>=4.2",
]

[project.scripts]
specbridge = "specbridge.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "testcontainers[postgres]>=4.8",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "types-pyyaml",
  "types-reportlab",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "specbridge"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["specbridge"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests against docker compose", "integration: needs Docker postgres"]
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["specbridge"]
omit = ["specbridge/ui/*"]
